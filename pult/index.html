<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f3f4f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0f11" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Пульт">
  <title>Пульт — GTD-админка</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%2316181a'/><text x='16' y='23' font-size='19' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='%23f3f4f2'>И</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="./assets/app.css">

  <script>
    /* Ставим тему до первой отрисовки, иначе экран мигает светлым при тёмной теме. */
    try {
      var saved = (JSON.parse(localStorage.getItem('ivanilin.gtd.v1')) || {}).settings || {};
      var t = saved.theme || 'auto';
      document.documentElement.setAttribute('data-theme',
        t === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t);
    } catch (e) {}
  </script>
</head>
<body>
  <div id="root"></div>
  <noscript>
    <div style="padding:40px;max-width:520px;margin:0 auto">
      <h1>Пульт</h1>
      <p style="color:#5c6269;margin-top:12px">Админка работает на JavaScript — включите его в браузере.</p>
    </div>
  </noscript>
  <script type="module" src="./assets/app.js"></script>
</body>
</html>
